name: refresh readme

# Keeps the generated regions of the README current: recent public push activity
# paired with the post explaining each project, plus anything newly published.
#
# It opens a pull request rather than pushing to main. That is not ceremony —
# the "main protection" ruleset has no bypass actors, deliberately, and routing
# bot output through a PR means `guard.sh` scans it before it goes public. This
# job publishes text fetched from an external CMS, so having the scanner inspect
# it first is the point, not an inconvenience.

on:
  schedule:
    # 06:20 UTC daily. Off the hour on purpose — the top of the hour is when
    # every cron on GitHub fires at once and scheduled jobs get queued.
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: write        # push the bot branch
  pull-requests: write   # open / update the PR
  statuses: write        # publish the `scan` result — see the step for why

concurrency:
  group: refresh-readme
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: bot/readme-refresh

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Regenerate
        id: gen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node scripts/build-readme.mjs
          rc=$?
          set -e
          case $rc in
            0) echo "changed=true"  >> "$GITHUB_OUTPUT" ;;
            3) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            *) exit $rc ;;
          esac

      - name: Scan generated output
        if: steps.gen.outputs.changed == 'true'
        env:
          GUARD_DENYLIST: ${{ secrets.GUARD_DENYLIST }}
        run: |
          git add README.md
          bash scripts/guard.sh

      - name: Open or update the pull request
        if: steps.gen.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Reuse one long-lived branch so repeated runs update a single PR
          # instead of littering the repo with one per day.
          #
          # actions/checkout only fetches the ref it checked out, so there is no
          # remote-tracking ref for the bot branch and --force-with-lease has
          # nothing to compare against — it fails "stale info" rather than
          # silently clobbering. Fetch it explicitly to give the lease a basis;
          # dropping to a bare --force would trade the safety away instead.
          git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" 2>/dev/null || true

          # Always branch from the commit we just built, so the PR is exactly
          # main plus one README commit and never accumulates old attempts.
          git checkout -B "$BRANCH"
          git add README.md
          git commit -m "Refresh generated README sections"

          if git rev-parse --verify --quiet "refs/remotes/origin/$BRANCH" >/dev/null; then
            git push --force-with-lease="$BRANCH:refs/remotes/origin/$BRANCH" origin "$BRANCH"
          else
            git push origin "$BRANCH"
          fi

          # GitHub deliberately does not start workflow runs for events raised by
          # GITHUB_TOKEN — that is what stops a bot pushing a commit that triggers
          # the bot. The consequence here is that guard.yml never fires on this
          # PR, so the required `scan` check would never appear and the PR would
          # sit BLOCKED forever.
          #
          # So publish the result directly. This is the job vouching for its own
          # scan, which is only defensible because the scan ran in this same job,
          # against the same tree, moments ago — and `set -e` plus a failing
          # guard.sh aborts before ever reaching this line. A red scan can not
          # reach a green status.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/$(git rev-parse HEAD)" \
            -f state=success \
            -f context=scan \
            -f description="guard.sh passed in the refresh job" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "Existing PR updated."
          else
            # Body assembled with printf rather than a multi-line string: every
            # line here has to stay indented inside the YAML block scalar, and a
            # line starting at column 0 would silently terminate it.
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Refresh generated README sections" \
              --body "$(printf '%s\n' \
                'Automated refresh of the regions between the `BEGIN:`/`END:` markers — recent push activity, paired writeups, and newly published posts.' \
                '' \
                'Generated by [`scripts/build-readme.mjs`](scripts/build-readme.mjs). The `scan` check gates this like any other change: the content is fetched from an external CMS, so it gets inspected before it goes public.')"
          fi

          # Queue the merge rather than performing it. Auto-merge still waits on
          # every rule in the ruleset, so if the status above is missing or red
          # this simply sits there — which is the desired failure mode.
          gh pr merge "$BRANCH" --auto --squash || \
            echo "::warning title=Auto-merge unavailable::PR left open for manual merge."

      - name: Report
        run: |
          if [ "${{ steps.gen.outputs.changed }}" = "true" ]; then
            echo "### README refreshed — PR opened or updated" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No change — nothing to publish" >> "$GITHUB_STEP_SUMMARY"
          fi
