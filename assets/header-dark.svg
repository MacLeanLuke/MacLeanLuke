<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="Luke MacLean — Senior Full Stack and Platform Engineer, Dallas Texas">
  <!--
    Dark-scheme twin of header-light.svg. Same geometry, GitHub's dark palette.
    Kept as a separate file rather than a CSS media query inside one SVG:
    an SVG loaded through <img> gets no cascade from the host page, and camo
    serves it in a context where inline @media support is inconsistent.
    Two files and a <picture> element is the boring option that always works.
  -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="0" y="52" font-size="44" font-weight="650" fill="#e6edf3" letter-spacing="-0.8">Luke MacLean</text>
    <text x="0" y="84" font-size="17" font-weight="450" fill="#9198a1">Senior Full Stack &amp; Platform Engineer</text>

    <line x1="0" y1="106" x2="1000" y2="106" stroke="#3d444d" stroke-width="1" />

    <text x="0" y="132" font-size="13" fill="#9198a1"
          font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
      Dallas, TX
      <tspan fill="#3d444d"> · </tspan>
      <tspan fill="#4493f8">luke-mac.com</tspan>
      <tspan fill="#3d444d"> · </tspan>
      operator-critical systems, and the boring plumbing that keeps them up
    </text>
  </g>
</svg>
